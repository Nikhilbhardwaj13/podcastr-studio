spring:
  application:
    name: podcastr-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/podcastr}
    username: ${SPRING_DATASOURCE_USERNAME:podcastr}
    password: ${SPRING_DATASOURCE_PASSWORD:podcastr}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
