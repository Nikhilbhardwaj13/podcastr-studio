services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: podcastr
      POSTGRES_USER: podcastr
      POSTGRES_PASSWORD: podcastr
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcastr -d podcastr"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: podcastr
      MINIO_ROOT_PASSWORD: podcastr-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
